name: PHP compatibility and security regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip, openssl, gd, sqlite3, dom
          coverage: none
      - name: Install MariaDB test binaries
        run: sudo apt-get update && sudo apt-get install -y mariadb-server mariadb-client
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Signed update without database privileges
        run: php tests/update_file_only.php
      - name: Schema and HTTP authorization regression tests
        run: python3 tests/run_schema.py
